<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Investimento vs. Market Cap</title>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f6f4;
    --border: rgba(65,64,66,0.16);
    --text: #414042;
    --muted: #8a8a8a;
    --gold: #7C9640;
  }
  :root[data-theme="dark"] {
    --bg: #1b1c19;
    --surface: #232420;
    --border: rgba(255,255,255,0.08);
    --text: #ece9e2;
    --muted: #9a9890;
    --gold: #9BB85E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Carlito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 16px 40px 0 40px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .tab {
    font-family: 'Carlito', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 12px 24px;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .tab:hover {
    color: var(--text);
    background: rgba(124,150,64,0.06);
  }
  .tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .master-toggle {
    margin-left: auto;
    font-family: 'Carlito', sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 7px 16px;
    cursor: pointer;
    transition: opacity .2s;
    margin-bottom: 10px;
  }
  .master-toggle:hover { opacity: .8; }
  .last-updated {
    font-family: 'Carlito', sans-serif;
    font-size: 11px;
    color: var(--muted);
    margin-left: 10px;
    margin-bottom: 10px;
    white-space: nowrap;
  }
  .chart-frame {
    flex: 1;
    width: 100%;
    border: none;
    min-height: calc(100vh - 52px);
  }
  .brand-logo {
    display: flex;
    align-items: center;
    margin-right: 24px;
    padding-bottom: 12px;
  }
  .brand-logo img {
    height: 26px;
    width: auto;
    display: block;
  }
  .brand-logo img.logo-dark { display: none; }
  html[data-theme="dark"] .brand-logo img.logo-light { display: none; }
  html[data-theme="dark"] .brand-logo img.logo-dark { display: block; }
</style>
</head>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Carlito', sans-serif;
    font-size: 13px;
    min-height: 100vh;
    padding: 40px;
  }

  /* ── HEADER ── */
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 24px;
  }
  .header-left h1 {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 30px; font-weight: 900; letter-spacing: 0.02em; line-height: 1.15;
  }
  .header-left h1 em { color: var(--gold); font-style: italic; }

  .kpi-value.green { color: var(--green); }
  .kpi-value.muted { color: var(--muted); }

  /* ── CARDS ── */
  .card {

    border-radius: 2px; padding: 22px 22px 14px 22px; margin-bottom: 18px;

  .card-title {

// ── HELPERS ──────────────────────────────────────────────────────────────────
function fmtM(v) { return v &gt;= 1000 ? `$${(v/1000).toFixed(2)}B` : `$${v.toFixed(0)}M`; }
function fmtMs(v) { return `${(v/1e6).toFixed(1)}M`; }

const tooltip = document.getElementById(&quot;tooltip&quot;);
function showTT(event, html) {
  tooltip.innerHTML = html;
  tooltip.classList.add(&quot;on&quot;);
  moveTT(event);
}
function moveTT(event) {
  let lx = event.clientX + 18, ty = event.clientY - 80;
  if (lx + 270 &gt; window.innerWidth) lx = event.clientX - 280;
  if (ty &lt; 10) ty = 10;
  tooltip.style.left = lx + &quot;px&quot;;
  tooltip.style.top  = ty + &quot;px&quot;;
}
function hideTT() { tooltip.classList.remove(&quot;on&quot;); }

// ── CHART 1: MAIN ────────────────────────────────────────────────────────────
function drawMain() {
  const cont = document.getElementById(&quot;chart-main&quot;).parentElement;
  const W = cont.clientWidth - 44;
  const H = 440;
  const mg = { top:28, right:84, bottom:50, left:84 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;

  const svg = d3.select(&quot;#chart-main&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g   = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);

  const x  = d3.scalePoint().domain(monthOrder).range([0,w]).padding(0.08);
  const yL = d3.scaleLinear().domain([0, d3.max(data,d=&gt;d.mcapUSDm)*1.18]).range([h,0]);
  const yR = d3.scaleLinear().domain([0, Math.max(
    d3.max(data,d=&gt;d.cumUSDm),
    d3.max(data,d=&gt;d.qBarUSDm||0)
  )*1.22]).range([h,0]);

  // Phase bands
  [
    {s:&quot;jan/23&quot;,e:&quot;dez/23&quot;,label:&quot;EXPLORAÇÃO INICIAL&quot;,c:colRGBA(&quot;gold&quot;,0.03)},
    {s:&quot;jan/24&quot;,e:&quot;dez/24&quot;,label:&quot;PEA · ESTUDOS · LICENCIAMENTO&quot;,c:colRGBA(&quot;blue&quot;,0.03)},
    {s:&quot;jan/25&quot;,e:&quot;mar/26&quot;,label:&quot;PFS · PLANTA PILOTO · LICENÇA&quot;,c:colRGBA(&quot;green&quot;,0.03)},
  ].forEach(p =&gt; {
    const x0=x(p.s), x1=x(p.e);
    if(!x0||!x1) return;
    g.append(&quot;rect&quot;)
      .attr(&quot;x&quot;,x0-x.step()*0.4).attr(&quot;width&quot;,x1-x0+x.step()*0.8)
      .attr(&quot;y&quot;,0).attr(&quot;height&quot;,h).attr(&quot;fill&quot;,p.c);
    g.append(&quot;text&quot;)
      .attr(&quot;x&quot;,(x0+x1)/2).attr(&quot;y&quot;,13).attr(&quot;text-anchor&quot;,&quot;middle&quot;)
      .attr(&quot;fill&quot;,T().muted2).attr(&quot;font-size&quot;,&quot;9px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.09em&quot;)
      .text(p.label);
  });

  // Gridlines
  yL.ticks(7).forEach(t =&gt; {
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;x2&quot;,w)
      .attr(&quot;y1&quot;,yL(t)).attr(&quot;y2&quot;,yL(t))
      .attr(&quot;stroke&quot;,gridRGBA(0.035)).attr(&quot;stroke-width&quot;,1);
  });

  // Quarterly bars
  const bw = Math.max(5, x.step()*0.36);
  data.filter(d=&gt;d.qBarUSDm!=null).forEach(d =&gt; {
    g.append(&quot;rect&quot;)
      .attr(&quot;x&quot;,x(d.month)-bw/2).attr(&quot;width&quot;,bw)
      .attr(&quot;y&quot;,yR(d.qBarUSDm)).attr(&quot;height&quot;,h-yR(d.qBarUSDm))
      .attr(&quot;fill&quot;,colRGBA(&quot;gold&quot;,0.45)).attr(&quot;rx&quot;,1);
  });

  // Cumulative dashed line
  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;none&quot;)
    .attr(&quot;stroke&quot;,colRGBA(&quot;gold&quot;,0.45))
    .attr(&quot;stroke-width&quot;,1.5).attr(&quot;stroke-dasharray&quot;,&quot;5,3&quot;)
    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;yR(d.cumUSDm)).curve(d3.curveMonotoneX));

  // MCap gradient area
  const defs = svg.append(&quot;defs&quot;);
  const gr = defs.append(&quot;linearGradient&quot;).attr(&quot;id&quot;,&quot;mcg-ara&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,0).attr(&quot;x2&quot;,0).attr(&quot;y2&quot;,1);
  gr.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;0%&quot;).attr(&quot;stop-color&quot;,T().teal).attr(&quot;stop-opacity&quot;,0.2);
  gr.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,T().teal).attr(&quot;stop-opacity&quot;,0.02);

  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;url(#mcg-ara)&quot;)
    .attr(&quot;d&quot;, d3.area().x(d=&gt;x(d.month)).y0(h).y1(d=&gt;yL(d.mcapUSDm)).curve(d3.curveMonotoneX));
  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().teal).attr(&quot;stroke-width&quot;,2)
    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;yL(d.mcapUSDm)).curve(d3.curveMonotoneX));

  // Project events
  projEvents.forEach(ev =&gt; {
    const xp = x(ev.month); if(!xp) return;
    const dp = data.find(d=&gt;d.month===ev.month);
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,xp).attr(&quot;x2&quot;,xp).attr(&quot;y1&quot;,0).attr(&quot;y2&quot;,h)
      .attr(&quot;stroke&quot;,ev.color).attr(&quot;stroke-width&quot;,1)
      .attr(&quot;stroke-opacity&quot;,0.22).attr(&quot;stroke-dasharray&quot;,&quot;3,4&quot;);
    if(dp) g.append(&quot;circle&quot;).attr(&quot;cx&quot;,xp).attr(&quot;cy&quot;,yL(dp.mcapUSDm))
      .attr(&quot;r&quot;,3).attr(&quot;fill&quot;,ev.color).attr(&quot;stroke&quot;,BG).attr(&quot;stroke-width&quot;,1.5);
  });

  // Issuance markers — diamond at bottom
  issuances.forEach(iv =&gt; {
    const xp = x(iv.month); if(!xp) return;
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,xp).attr(&quot;x2&quot;,xp).attr(&quot;y1&quot;,0).attr(&quot;y2&quot;,h)
      .attr(&quot;stroke&quot;,T().blue).attr(&quot;stroke-width&quot;,1)
      .attr(&quot;stroke-opacity&quot;,0.35).attr(&quot;stroke-dasharray&quot;,&quot;1,3&quot;);
    const ds = 5;
    g.append(&quot;polygon&quot;)
      .attr(&quot;points&quot;,`${xp},${h+ds} ${xp+ds},${h+ds*2} ${xp},${h+ds*3} ${xp-ds},${h+ds*2}`)
      .attr(&quot;fill&quot;,T().blue).attr(&quot;opacity&quot;,0.8);
  });

  // Peak annotation
  g.append(&quot;circle&quot;).attr(&quot;cx&quot;,x(peak.month)).attr(&quot;cy&quot;,yL(peak.mcapUSDm))
    .attr(&quot;r&quot;,5).attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().teal)
    .attr(&quot;stroke-width&quot;,1.5).attr(&quot;stroke-dasharray&quot;,&quot;3,2&quot;);
  const peakLabelX = x(peak.month) &gt; w*0.7 ? x(peak.month) - 8 : x(peak.month) + 8;
  const peakAnchor = x(peak.month) &gt; w*0.7 ? &quot;end&quot; : &quot;start&quot;;
  g.append(&quot;text&quot;)
    .attr(&quot;x&quot;,peakLabelX).attr(&quot;y&quot;,yL(peak.mcapUSDm)-9)
    .attr(&quot;text-anchor&quot;, peakAnchor)
    .attr(&quot;fill&quot;,T().teal).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;)
    .text(`${fmtM(peak.mcapUSDm)} (${peak.month})`);

  // Axes
  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(0,${h})`).call(
    d3.axisBottom(x).tickValues(monthOrder.filter((_,i)=&gt;i%3===0)).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);
  });
  g.append(&quot;g&quot;).call(
    d3.axisLeft(yL).ticks(7).tickFormat(d=&gt;fmtM(d)).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().teal).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${w},0)`).call(
    d3.axisRight(yR).ticks(7).tickFormat(d=&gt;`$${d.toFixed(0)}M`).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,colRGBA(&quot;gold&quot;,0.75)).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });

  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-68)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().teal).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;)
    .text(&quot;MARKET CAP (USD)&quot;);
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(90)&quot;).attr(&quot;x&quot;,h/2).attr(&quot;y&quot;,-(w+68))
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,colRGBA(&quot;gold&quot;,0.75)).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;)
    .text(&quot;INVESTIMENTO (USD)&quot;);

  // Hover
  const hLine = g.append(&quot;line&quot;).attr(&quot;y1&quot;,0).attr(&quot;y2&quot;,h)
    .attr(&quot;stroke&quot;,gridRGBA(0.1)).attr(&quot;stroke-width&quot;,1)
    .style(&quot;display&quot;,&quot;none&quot;).attr(&quot;pointer-events&quot;,&quot;none&quot;);

  g.append(&quot;rect&quot;).attr(&quot;width&quot;,w).attr(&quot;height&quot;,h)
    .attr(&quot;fill&quot;,&quot;transparent&quot;).attr(&quot;cursor&quot;,&quot;crosshair&quot;)
    .on(&quot;mousemove&quot;, function(event) {
      const [mx] = d3.pointer(event);
      let ni=0, md=Infinity;
      monthOrder.forEach((m,i)=&gt;{ const d2=Math.abs(x(m)-mx); if(d2&lt;md){md=d2;ni=i;} });
      const d = data[ni];
      hLine.style(&quot;display&quot;,null).attr(&quot;x1&quot;,x(d.month)).attr(&quot;x2&quot;,x(d.month));
      const ev  = projEvents.find(e=&gt;e.month===d.month);
      const iss = issuances.find(e=&gt;e.month===d.month);
      const evHTML = ev  ? `&lt;div class=&quot;tt-event&quot; style=&quot;border-left:2px solid ${ev.color};color:${ev.color}&quot;&gt;${ev.label}&lt;/div&gt;` : '';
      const isHTML = iss ? `&lt;div class=&quot;tt-event&quot; style=&quot;border-left:2px solid var(--blue);color:var(--blue)&quot;&gt;${iss.label.replace('\n','&lt;br&gt;')}&lt;/div&gt;` : '';
      showTT(event, `
        &lt;div class=&quot;tt-month&quot;&gt;${d.month.toUpperCase()}&lt;/div&gt;
        ${evHTML}${isHTML}
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Ações em circulação&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;${fmtMs(d.shares)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Cotação&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;CAD ${d.priceCAD.toFixed(4)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;CAD/USD&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;${d.fx.toFixed(4)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Market Cap&lt;/span&gt;&lt;span class=&quot;v teal&quot;&gt;${fmtM(d.mcapUSDm)}&lt;/span&gt;&lt;/div&gt;
        &lt;hr class=&quot;tt-div&quot;&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Invest. Acumulado&lt;/span&gt;&lt;span class=&quot;v gold&quot;&gt;$${d.cumUSDm.toFixed(1)}M&lt;/span&gt;&lt;/div&gt;
        ${d.qBarUSDm!=null?`&lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Invest. Trimestral&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;$${d.qBarUSDm.toFixed(1)}M&lt;/span&gt;&lt;/div&gt;`:''}
        &lt;hr class=&quot;tt-div&quot;&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;MCap / Acumulado&lt;/span&gt;&lt;span class=&quot;v ${d.ratio!=null&amp;&amp;d.ratio&gt;=1?'green':'red'}&quot;&gt;${d.ratio!=null?`${d.ratio.toFixed(2)}×`:'—'}&lt;/span&gt;&lt;/div&gt;
      `);
    })
    .on(&quot;mousemove.move&quot;, moveTT)
    .on(&quot;mouseleave&quot;, ()=&gt;{ hLine.style(&quot;display&quot;,&quot;none&quot;); hideTT(); });
}

// ── CHART 2: SHARES ──────────────────────────────────────────────────────────
function drawShares() {
  const cont = document.getElementById(&quot;chart-shares&quot;).parentElement;
  const W = cont.clientWidth - 44;
  const H = 180;
  const mg = { top:20, right:84, bottom:48, left:84 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;

  const svg = d3.select(&quot;#chart-shares&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g   = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);

  const x = d3.scalePoint().domain(monthOrder).range([0,w]).padding(0.08);
  const y = d3.scaleLinear()
    .domain([d3.min(data,d=&gt;d.shares)*0.93, d3.max(data,d=&gt;d.shares)*1.07])
    .range([h,0]);

  yL_ticks: y.ticks(4).forEach(t =&gt; {
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;x2&quot;,w).attr(&quot;y1&quot;,y(t)).attr(&quot;y2&quot;,y(t))
      .attr(&quot;stroke&quot;,gridRGBA(0.035)).attr(&quot;stroke-width&quot;,1);
  });

  const defs2 = svg.append(&quot;defs&quot;);
  const gr2 = defs2.append(&quot;linearGradient&quot;).attr(&quot;id&quot;,&quot;shg-ara&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,0).attr(&quot;x2&quot;,0).attr(&quot;y2&quot;,1);
  gr2.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;0%&quot;).attr(&quot;stop-color&quot;,T().blue).attr(&quot;stop-opacity&quot;,0.2);
  gr2.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,T().blue).attr(&quot;stop-opacity&quot;,0.02);

  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;url(#shg-ara)&quot;)
    .attr(&quot;d&quot;, d3.area().x(d=&gt;x(d.month)).y0(h).y1(d=&gt;y(d.shares)).curve(d3.curveStepAfter));
  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().blue).attr(&quot;stroke-width&quot;,1.5)
    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;y(d.shares)).curve(d3.curveStepAfter));

  issuances.forEach(iv =&gt; {
    const xp = x(iv.month); if(!xp) return;
    const dp = data.find(d=&gt;d.month===iv.month);
    if(!dp) return;
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,xp).attr(&quot;x2&quot;,xp).attr(&quot;y1&quot;,0).attr(&quot;y2&quot;,h)
      .attr(&quot;stroke&quot;,T().blue).attr(&quot;stroke-width&quot;,1)
      .attr(&quot;stroke-opacity&quot;,0.4).attr(&quot;stroke-dasharray&quot;,&quot;2,3&quot;);
    g.append(&quot;circle&quot;).attr(&quot;cx&quot;,xp).attr(&quot;cy&quot;,y(dp.shares))
      .attr(&quot;r&quot;,4).attr(&quot;fill&quot;,T().blue).attr(&quot;stroke&quot;,BG).attr(&quot;stroke-width&quot;,1.5);
    const addedM = (iv.shares/1e6).toFixed(iv.shares &gt; 1e6 ? 1 : 2);
    const labelX = xp &gt; w*0.8 ? xp - 6 : xp + 6;
    const anchor = xp &gt; w*0.8 ? &quot;end&quot; : &quot;start&quot;;
    g.append(&quot;text&quot;)
      .attr(&quot;x&quot;,labelX).attr(&quot;y&quot;,y(dp.shares)-9)
      .attr(&quot;text-anchor&quot;,anchor)
      .attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;9px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;)
      .text(`+${addedM}M`);
  });

  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(0,${h})`).call(
    d3.axisBottom(x).tickValues(monthOrder.filter((_,i)=&gt;i%3===0)).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);
  });
  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(4).tickFormat(d=&gt;`${(d/1e6).toFixed(0)}M`).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-68)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;)
    .text(&quot;AÇÕES EM CIRCULAÇÃO&quot;);
}

// ── CHART 3: RATIO ───────────────────────────────────────────────────────────
function drawRatio() {
  const cont = document.getElementById(&quot;chart-ratio&quot;).parentElement;
  const W = cont.clientWidth - 44;
  const H = 200;
  const mg = { top:22, right:84, bottom:48, left:84 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;

  const svg = d3.select(&quot;#chart-ratio&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g   = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);

  const rData = data.filter(d=&gt;d.ratio!=null &amp;&amp; d.cumUSDm&gt;0.5);
  const x = d3.scalePoint().domain(monthOrder).range([0,w]).padding(0.08);
  const y = d3.scaleLinear().domain([0, d3.max(rData,d=&gt;d.ratio)*1.12]).range([h,0]);

  // 1× reference
  g.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;x2&quot;,w).attr(&quot;y1&quot;,y(1)).attr(&quot;y2&quot;,y(1))
    .attr(&quot;stroke&quot;,gridRGBA(0.13)).attr(&quot;stroke-width&quot;,1).attr(&quot;stroke-dasharray&quot;,&quot;4,4&quot;);
  g.append(&quot;text&quot;).attr(&quot;x&quot;,w+5).attr(&quot;y&quot;,y(1)+4)
    .attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;9px&quot;).attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(&quot;1×&quot;);

  const defs3 = svg.append(&quot;defs&quot;);
  const gr3 = defs3.append(&quot;linearGradient&quot;).attr(&quot;id&quot;,&quot;ratg-ara&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,0).attr(&quot;x2&quot;,0).attr(&quot;y2&quot;,1);
  gr3.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;0%&quot;).attr(&quot;stop-color&quot;,T().green).attr(&quot;stop-opacity&quot;,0.25);
  gr3.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,T().green).attr(&quot;stop-opacity&quot;,0.02);

  g.append(&quot;path&quot;).datum(rData)
    .attr(&quot;fill&quot;,&quot;url(#ratg-ara)&quot;)
    .attr(&quot;d&quot;, d3.area().x(d=&gt;x(d.month)).y0(h).y1(d=&gt;y(d.ratio)).curve(d3.curveMonotoneX));
  g.append(&quot;path&quot;).datum(rData)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().green).attr(&quot;stroke-width&quot;,2)
    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;y(d.ratio)).curve(d3.curveMonotoneX));

  // Peak
  const pk = rData.reduce((a,b)=&gt;a.ratio&gt;b.ratio?a:b);
  g.append(&quot;circle&quot;).attr(&quot;cx&quot;,x(pk.month)).attr(&quot;cy&quot;,y(pk.ratio))
    .attr(&quot;r&quot;,4.5).attr(&quot;fill&quot;,T().green);
  const pkLabelX = x(pk.month) &gt; w*0.7 ? x(pk.month) - 8 : x(pk.month) + 8;
  const pkAnchor = x(pk.month) &gt; w*0.7 ? &quot;end&quot; : &quot;start&quot;;
  g.append(&quot;text&quot;).attr(&quot;x&quot;,pkLabelX).attr(&quot;y&quot;,y(pk.ratio)-8)
    .attr(&quot;text-anchor&quot;,pkAnchor)
    .attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;).attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;)
    .text(`${pk.ratio.toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)}× (${pk.month})`);

  // Current
  const lrd = rData[rData.length-1];

    .attr(&quot;r&quot;,3.5).attr(&quot;fill&quot;,T().green).attr(&quot;opacity&quot;,0.7);

    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(`${lrd.ratio.toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)}× atual`);

  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(0,${h})`).call(
    d3.axisBottom(x).tickValues(monthOrder.filter((_,i)=&gt;i%3===0)).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);
  });
  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(5).tickFormat(d=&gt;`${d.toFixed(0)}×`).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-68)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;)
    .text(&quot;MCap / INVEST. ACUM. (×)&quot;);
}

  const cumUSDm  = (cumInvK[m] || 0) / 1000;
  const qBarUSDm = qBarK[m] != null ? qBarK[m] / 1000 : null;
  const ratio    = (cumUSDm &gt; 0.5 &amp;&amp; mcap &gt; 0) ? mcap / cumUSDm : null;
  return { month:m, shares:s, priceAUD:p, fx, mcapUSDm:mcap, cumUSDm, qBarUSDm, ratio };
});

function drawRatio() {
  const cont = document.getElementById(&quot;chart-ratio&quot;).parentElement;
  const W = cont.clientWidth - 44;
  const H = 200;
  const mg = { top:22, right:84, bottom:48, left:84 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;

  const svg = d3.select(&quot;#chart-ratio&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g   = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);

    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(`${lrd.ratio.toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)}× atual`);

  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(5).tickFormat(d=&gt;`${d.toFixed(0)}×`).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;).attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-68)

function fmtM(v) { return v &gt;= 1000 ? `$${(v/1000).toFixed(2)}B` : `$${v.toFixed(0)}M`; }
function fmtB(v) { return `${(v/1e9).toFixed(3)}B`; }

const tooltip = document.getElementById(&quot;tooltip&quot;);
function showTT(event, html) {
  tooltip.innerHTML = html;

  moveTT(event);
}
function moveTT(event) {
  let lx = event.clientX + 18, ty = event.clientY - 80;
  if (lx + 260 &gt; window.innerWidth) lx = event.clientX - 270;
  if (ty &lt; 10) ty = 10;
  tooltip.style.left = lx + &quot;px&quot;;

}
function hideTT() { tooltip.classList.remove(&quot;on&quot;); }

      const d = data[ni];
      hLine.style(&quot;display&quot;,null).attr(&quot;x1&quot;,x(d.month)).attr(&quot;x2&quot;,x(d.month));

      const ev  = projEvents.find(e=&gt;e.month===d.month);
      const iss = issuances.find(e=&gt;e.month===d.month);
      const evHTML = ev  ? `&lt;div class=&quot;tt-event&quot; style=&quot;border-left:2px solid ${ev.color};color:${ev.color}&quot;&gt;${ev.label}&lt;/div&gt;` : '';
      const isHTML = iss ? `&lt;div class=&quot;tt-event&quot; style=&quot;border-left:2px solid var(--blue);color:var(--blue)&quot;&gt;${iss.label}&lt;/div&gt;` : '';

      showTT(event, `
        &lt;div class=&quot;tt-month&quot;&gt;${d.month.toUpperCase()}&lt;/div&gt;
        ${evHTML}${isHTML}
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Ações em circulação&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;${fmtB(d.shares)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Cotação&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;A$ ${d.priceAUD.toFixed(4)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;AUD/USD&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;${d.fx.toFixed(4)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Market Cap&lt;/span&gt;&lt;span class=&quot;v teal&quot;&gt;${fmtM(d.mcapUSDm)}&lt;/span&gt;&lt;/div&gt;
        &lt;hr class=&quot;tt-div&quot;&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Invest. Acumulado&lt;/span&gt;&lt;span class=&quot;v gold&quot;&gt;${fmtM(d.cumUSDm)}&lt;/span&gt;&lt;/div&gt;
        ${d.qBarUSDm!=null?`&lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Invest. Trimestral&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;$${d.qBarUSDm.toFixed(1)}M&lt;/span&gt;&lt;/div&gt;`:''}
        &lt;hr class=&quot;tt-div&quot;&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;MCap / Acumulado&lt;/span&gt;&lt;span class=&quot;v ${d.ratio&gt;=1?'green':'red'}&quot;&gt;${d.ratio!=null?`${d.ratio.toFixed(2)}×`:'—'}&lt;/span&gt;&lt;/div&gt;
      `);
    })
    .on(&quot;mousemove.move&quot;, moveTT)
    .on(&quot;mouseleave&quot;, ()=&gt;{ hLine.style(&quot;display&quot;,&quot;none&quot;); hideTT(); });
}

// ── CHART 2: SHARES ──────────────────────────────────────────────────────────

function drawShares() {
  const cont = document.getElementById(&quot;chart-shares&quot;).parentElement;
  const W = cont.clientWidth - 44;
  const H = 180;
  const mg = { top:20, right:84, bottom:48, left:78 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;

  const svg = d3.select(&quot;#chart-shares&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g   = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);

  const x = d3.scalePoint().domain(monthOrder).range([0,w]).padding(0.08);
  const y = d3.scaleLinear()
    .domain([d3.min(data,d=&gt;d.shares)*0.95, d3.max(data,d=&gt;d.shares)*1.05])
    .range([h,0]);

  // Gridlines
  y.ticks(4).forEach(t =&gt; {
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;x2&quot;,w).attr(&quot;y1&quot;,y(t)).attr(&quot;y2&quot;,y(t))
      .attr(&quot;stroke&quot;,gridRGBA(0.035)).attr(&quot;stroke-width&quot;,1);
  });

  // Step line for shares (step-after to show jumps clearly)
  const defs2 = svg.append(&quot;defs&quot;);
  const gr2 = defs2.append(&quot;linearGradient&quot;).attr(&quot;id&quot;,&quot;shg&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,0).attr(&quot;x2&quot;,0).attr(&quot;y2&quot;,1);
  gr2.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;0%&quot;).attr(&quot;stop-color&quot;,T().blue).attr(&quot;stop-opacity&quot;,0.2);
  gr2.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,T().blue).attr(&quot;stop-opacity&quot;,0.02);

  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;url(#shg)&quot;)
    .attr(&quot;d&quot;, d3.area().x(d=&gt;x(d.month)).y0(h).y1(d=&gt;y(d.shares)).curve(d3.curveStepAfter));
  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().blue).attr(&quot;stroke-width&quot;,1.5)
    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;y(d.shares)).curve(d3.curveStepAfter));

  // Issuance markers
  issuances.forEach(iv =&gt; {
    const xp = x(iv.month); if(!xp) return;
    const dp = data.find(d=&gt;d.month===iv.month);
    if(!dp) return;
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,xp).attr(&quot;x2&quot;,xp).attr(&quot;y1&quot;,0).attr(&quot;y2&quot;,h)
      .attr(&quot;stroke&quot;,T().blue).attr(&quot;stroke-width&quot;,1)
      .attr(&quot;stroke-opacity&quot;,0.4).attr(&quot;stroke-dasharray&quot;,&quot;2,3&quot;);
    g.append(&quot;circle&quot;).attr(&quot;cx&quot;,xp).attr(&quot;cy&quot;,y(dp.shares))
      .attr(&quot;r&quot;,4).attr(&quot;fill&quot;,T().blue).attr(&quot;stroke&quot;,BG).attr(&quot;stroke-width&quot;,1.5);
    // Label with shares added
    const addedM = (iv.shares/1e6).toFixed(0);
    g.append(&quot;text&quot;)
      .attr(&quot;x&quot;,xp).attr(&quot;y&quot;,y(dp.shares)-10)
      .attr(&quot;text-anchor&quot;,&quot;middle&quot;)
      .attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;9px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;)
      .text(`+${addedM}M`);
  });

  // Axes
  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(0,${h})`).call(
    d3.axisBottom(x).tickValues(monthOrder.filter((_,i)=&gt;i%3===0)).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);
  });
  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(4).tickFormat(d=&gt;`${(d/1e9).toFixed(2)}B`).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-63)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;)
    .text(&quot;AÇÕES EM CIRCULAÇÃO&quot;);
}

function drawRatio() {
  const cont = document.getElementById(&quot;chart-ratio&quot;).parentElement;
  const W = cont.clientWidth - 44;
  const H = 200;
  const mg = { top:22, right:84, bottom:48, left:78 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;

  const svg = d3.select(&quot;#chart-ratio&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g   = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);

  const rData = data.filter(d=&gt;d.ratio!=null &amp;&amp; d.cumUSDm&gt;0.5);
  const x = d3.scalePoint().domain(monthOrder).range([0,w]).padding(0.08);
  const y = d3.scaleLinear().domain([0, d3.max(rData,d=&gt;d.ratio)*1.12]).range([h,0]);

  // 1× reference
  g.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;x2&quot;,w).attr(&quot;y1&quot;,y(1)).attr(&quot;y2&quot;,y(1))
    .attr(&quot;stroke&quot;,gridRGBA(0.13)).attr(&quot;stroke-width&quot;,1).attr(&quot;stroke-dasharray&quot;,&quot;4,4&quot;);
  g.append(&quot;text&quot;).attr(&quot;x&quot;,w+5).attr(&quot;y&quot;,y(1)+4)
    .attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;9px&quot;).attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(&quot;1×&quot;);

  // Fill: green above 1×, red below
  const defs3 = svg.append(&quot;defs&quot;);
  const gr3 = defs3.append(&quot;linearGradient&quot;).attr(&quot;id&quot;,&quot;ratg&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,0).attr(&quot;x2&quot;,0).attr(&quot;y2&quot;,1);

  gr3.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,T().green).attr(&quot;stop-opacity&quot;,0.02);

  g.append(&quot;path&quot;).datum(rData)
    .attr(&quot;fill&quot;,&quot;url(#ratg)&quot;)
    .attr(&quot;d&quot;, d3.area().x(d=&gt;x(d.month)).y0(h).y1(d=&gt;y(d.ratio)).curve(d3.curveMonotoneX));
  g.append(&quot;path&quot;).datum(rData)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().green).attr(&quot;stroke-width&quot;,2)
    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;y(d.ratio)).curve(d3.curveMonotoneX));

  // Peak
  const pk = rData.reduce((a,b)=&gt;a.ratio&gt;b.ratio?a:b);
  g.append(&quot;circle&quot;).attr(&quot;cx&quot;,x(pk.month)).attr(&quot;cy&quot;,y(pk.ratio))
    .attr(&quot;r&quot;,4.5).attr(&quot;fill&quot;,T().green);
  g.append(&quot;text&quot;).attr(&quot;x&quot;,x(pk.month)+8).attr(&quot;y&quot;,y(pk.ratio)-8)
    .attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;).attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;)
    .text(`${pk.ratio.toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)}× (${pk.month})`);

  // Current
  const lrd = rData[rData.length-1];
  g.append(&quot;circle&quot;).attr(&quot;cx&quot;,x(lrd.month)).attr(&quot;cy&quot;,y(lrd.ratio))
    .attr(&quot;r&quot;,3.5).attr(&quot;fill&quot;,T().green).attr(&quot;opacity&quot;,0.7);
  g.append(&quot;text&quot;).attr(&quot;x&quot;,x(lrd.month)-8).attr(&quot;y&quot;,y(lrd.ratio)-9)
    .attr(&quot;text-anchor&quot;,&quot;end&quot;).attr(&quot;fill&quot;,colRGBA(&quot;green&quot;,0.65)).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(`${lrd.ratio.toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)}× atual`);

  // Axes
  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(0,${h})`).call(
    d3.axisBottom(x).tickValues(monthOrder.filter((_,i)=&gt;i%3===0)).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);
  });
  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(5).tickFormat(d=&gt;`${d.toFixed(0)}×`).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-63)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;)
    .text(&quot;MCap / INVEST. ACUM. (×)&quot;);
}

      const [mx] = d3.pointer(event);
      let ni=0, md=Infinity;
      monthOrder.forEach((m,i)=&gt;{ const d2=Math.abs(x(m)-mx); if(d2&lt;md){md=d2;ni=i;} });

      const isHTML = iss.map(iv=&gt;`&lt;div class=&quot;tt-event&quot; style=&quot;border-left:2px solid var(--blue);color:var(--blue)&quot;&gt;${iv.label.replace('\n','&lt;br&gt;')}&lt;/div&gt;`).join('');

      showTT(event, `

        ${evHTML}${isHTML}${suspHTML}
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Ações em circulação&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;${fmtBs(d.shares)}&lt;/span&gt;&lt;/div&gt;

        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;AUD/USD&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;${d.fx.toFixed(4)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Market Cap&lt;/span&gt;&lt;span class=&quot;v teal&quot;&gt;${d.mcapUSDm !== null ? fmtM(d.mcapUSDm) : '—'}&lt;/span&gt;&lt;/div&gt;
        &lt;hr class=&quot;tt-div&quot;&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Invest. Acumulado&lt;/span&gt;&lt;span class=&quot;v gold&quot;&gt;$${d.cumUSDm.toFixed(1)}M&lt;/span&gt;&lt;/div&gt;
        ${d.qBarUSDm!=null?`&lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Invest. Trimestral&lt;/span&gt;&lt;span class=&quot;v&quot;&gt;$${d.qBarUSDm.toFixed(1)}M&lt;/span&gt;&lt;/div&gt;`:''}
        &lt;hr class=&quot;tt-div&quot;&gt;
        &lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;MCap / Acumulado&lt;/span&gt;&lt;span class=&quot;v ${d.ratio!=null&amp;&amp;d.ratio&gt;=1?'green':'red'}&quot;&gt;${d.ratio!=null?`${d.ratio.toFixed(2)}×`:'—'}&lt;/span&gt;&lt;/div&gt;
      `);
    })

// ── CHART 2: SHARES ───────────────────────────────────────────────────────────
function drawShares() {
  const cont = document.getElementById(&quot;chart-shares&quot;).parentElement;
  const W = cont.clientWidth - 44;
  const H = 180;
  const mg = { top:20, right:84, bottom:48, left:84 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;

  const svg = d3.select(&quot;#chart-shares&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g   = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);

  const x = d3.scalePoint().domain(monthOrder).range([0,w]).padding(0.08);
  const y = d3.scaleLinear()
    .domain([d3.min(data,d=&gt;d.shares)*0.88, d3.max(data,d=&gt;d.shares)*1.07])
    .range([h,0]);

  y.ticks(4).forEach(t =&gt; {
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;x2&quot;,w).attr(&quot;y1&quot;,y(t)).attr(&quot;y2&quot;,y(t))
      .attr(&quot;stroke&quot;,gridRGBA(0.035)).attr(&quot;stroke-width&quot;,1);
  });

  const defs2 = svg.append(&quot;defs&quot;);
  const gr2 = defs2.append(&quot;linearGradient&quot;).attr(&quot;id&quot;,&quot;shg-sgq&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,0).attr(&quot;x2&quot;,0).attr(&quot;y2&quot;,1);
  gr2.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;0%&quot;).attr(&quot;stop-color&quot;,T().blue).attr(&quot;stop-opacity&quot;,0.2);
  gr2.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,T().blue).attr(&quot;stop-opacity&quot;,0.02);

  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;url(#shg-sgq)&quot;)
    .attr(&quot;d&quot;, d3.area().x(d=&gt;x(d.month)).y0(h).y1(d=&gt;y(d.shares)).curve(d3.curveStepAfter));
  g.append(&quot;path&quot;).datum(data)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().blue).attr(&quot;stroke-width&quot;,1.5)
    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;y(d.shares)).curve(d3.curveStepAfter));

  issuances.forEach(iv =&gt; {
    const xp = x(iv.month); if(!xp) return;
    const dp = data.find(d=&gt;d.month===iv.month);
    if(!dp) return;
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,xp).attr(&quot;x2&quot;,xp).attr(&quot;y1&quot;,0).attr(&quot;y2&quot;,h)
      .attr(&quot;stroke&quot;,T().blue).attr(&quot;stroke-width&quot;,1).attr(&quot;stroke-opacity&quot;,0.4).attr(&quot;stroke-dasharray&quot;,&quot;2,3&quot;);
    g.append(&quot;circle&quot;).attr(&quot;cx&quot;,xp).attr(&quot;cy&quot;,y(dp.shares))
      .attr(&quot;r&quot;,4).attr(&quot;fill&quot;,T().blue).attr(&quot;stroke&quot;,BG).attr(&quot;stroke-width&quot;,1.5);
    const prev = data.find(d=&gt;d.month===monthOrder[monthOrder.indexOf(iv.month)-1]);
    const added = prev ? dp.shares - prev.shares : 0;
    const addedLabel = added &gt;= 1e9 ? `+${(added/1e9).toFixed(2)}B` : `+${(added/1e6).toFixed(0)}M`;
    const labelX = xp &gt; w*0.8 ? xp - 6 : xp + 6;
    const anchor = xp &gt; w*0.8 ? &quot;end&quot; : &quot;start&quot;;
    g.append(&quot;text&quot;).attr(&quot;x&quot;,labelX).attr(&quot;y&quot;,y(dp.shares)-9)
      .attr(&quot;text-anchor&quot;,anchor).attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;9px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(addedLabel);
  });

  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(0,${h})`).call(
    d3.axisBottom(x).tickValues(monthOrder.filter((_,i)=&gt;i%3===0)).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);
  });
  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(4).tickFormat(d=&gt; d &gt;= 1e9 ? `${(d/1e9).toFixed(1)}B` : `${(d/1e6).toFixed(0)}M`).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-68)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().blue).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;).text(&quot;AÇÕES EM CIRCULAÇÃO&quot;);
}

function drawRatio() {

  const W = cont.clientWidth - 44;

  g.append(&quot;path&quot;).datum(rData)

    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;y(d.ratio)).curve(d3.curveMonotoneX));

  const pk = rData.reduce((a,b)=&gt;a.ratio&gt;b.ratio?a:b);

    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(`${lrd.ratio.toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)}× atual`);

  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(0,${h})`).call(
    d3.axisBottom(x).tickValues(monthOrder.filter((_,i)=&gt;i%3===0)).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);

  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(5).tickFormat(d=&gt;`${d.toFixed(0)}×`).tickSize(4)

  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-68)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;).text(&quot;MCap / INVEST. ACUM. (×)&quot;);
}

// ── CHART 3: RATIO ────────────────────────────────────────────────────────────
function drawRatio() {
  const cont = document.getElementById(&quot;chart-ratio&quot;).parentElement;
  const W = cont.clientWidth - 44;
  const H = 200;
  const mg = { top:22, right:84, bottom:48, left:84 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;

  const svg = d3.select(&quot;#chart-ratio&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g   = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);

  const rData = data.filter(d=&gt;d.ratio!=null &amp;&amp; d.cumUSDm&gt;0.5);
  const x = d3.scalePoint().domain(monthOrder).range([0,w]).padding(0.08);
  const y = d3.scaleLinear().domain([0, d3.max(rData,d=&gt;d.ratio)*1.12]).range([h,0]);

  // 1× reference
  g.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;x2&quot;,w).attr(&quot;y1&quot;,y(1)).attr(&quot;y2&quot;,y(1))
    .attr(&quot;stroke&quot;,gridRGBA(0.13)).attr(&quot;stroke-width&quot;,1).attr(&quot;stroke-dasharray&quot;,&quot;4,4&quot;);
  g.append(&quot;text&quot;).attr(&quot;x&quot;,w+5).attr(&quot;y&quot;,y(1)+4)
    .attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;9px&quot;).attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(&quot;1×&quot;);

  const defs3 = svg.append(&quot;defs&quot;);
  const gr3 = defs3.append(&quot;linearGradient&quot;).attr(&quot;id&quot;,&quot;ratg-vmm&quot;).attr(&quot;x1&quot;,0).attr(&quot;y1&quot;,0).attr(&quot;x2&quot;,0).attr(&quot;y2&quot;,1);

  gr3.append(&quot;stop&quot;).attr(&quot;offset&quot;,&quot;100%&quot;).attr(&quot;stop-color&quot;,T().green).attr(&quot;stop-opacity&quot;,0.02);

  g.append(&quot;path&quot;).datum(rData)
    .attr(&quot;fill&quot;,&quot;url(#ratg-vmm)&quot;)
    .attr(&quot;d&quot;, d3.area().x(d=&gt;x(d.month)).y0(h).y1(d=&gt;y(d.ratio)).curve(d3.curveMonotoneX));
  g.append(&quot;path&quot;).datum(rData)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().green).attr(&quot;stroke-width&quot;,2)
    .attr(&quot;d&quot;, d3.line().x(d=&gt;x(d.month)).y(d=&gt;y(d.ratio)).curve(d3.curveMonotoneX));

  const pk = rData.reduce((a,b)=&gt;a.ratio&gt;b.ratio?a:b);
  g.append(&quot;circle&quot;).attr(&quot;cx&quot;,x(pk.month)).attr(&quot;cy&quot;,y(pk.ratio)).attr(&quot;r&quot;,4.5).attr(&quot;fill&quot;,T().green);

    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).text(`${lrd.ratio.toFixed(1).replace(&quot;.&quot;,&quot;,&quot;)}× atual`);

    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);
  });
  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(5).tickFormat(d=&gt;`${d.toFixed(0)}×`).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-68)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().green).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;).text(&quot;MCap / INVEST. ACUM. (×)&quot;);
}

  const W = cont.clientWidth - 44;
  const H = 210;
  const mg = { top:20, right:84, bottom:48, left:84 };
  const w = W - mg.left - mg.right;
  const h = H - mg.top - mg.bottom;
  const svg = d3.select(&quot;#chart-volume&quot;).attr(&quot;width&quot;,W).attr(&quot;height&quot;,H);
  const g = svg.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(${mg.left},${mg.top})`);
  const x = d3.scaleTime().domain(d3.extent(parsed,d=&gt;d.date)).range([0,w]);
  const maxVol = d3.max(parsed,d=&gt;d.vol);
  const y = d3.scaleLinear().domain([0,maxVol*1.15]).range([h,0]);
  y.ticks(4).forEach(t=&gt;{
    g.append(&quot;line&quot;).attr(&quot;x1&quot;,0).attr(&quot;x2&quot;,w).attr(&quot;y1&quot;,y(t)).attr(&quot;y2&quot;,y(t))
      .attr(&quot;stroke&quot;,gridRGBA(0.035)).attr(&quot;stroke-width&quot;,1);
  });
  const barW = Math.max(1.2,(w/parsed.length)*0.72);
  g.selectAll(&quot;.vol-bar&quot;).data(parsed).enter().append(&quot;rect&quot;)
    .attr(&quot;x&quot;,d=&gt;x(d.date)-barW/2).attr(&quot;y&quot;,d=&gt;y(d.vol))
    .attr(&quot;width&quot;,barW).attr(&quot;height&quot;,d=&gt;h-y(d.vol))
    .attr(&quot;fill&quot;,T().teal).attr(&quot;opacity&quot;,0.5);
  const maW=20;
  const maData=parsed.slice(maW-1).map((d,i)=&gt;({date:d.date,ma:d3.mean(parsed.slice(i,i+maW),s=&gt;s.vol)}));
  g.append(&quot;path&quot;).datum(maData)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;stroke&quot;,T().teal).attr(&quot;stroke-width&quot;,1.8).attr(&quot;opacity&quot;,0.9)
    .attr(&quot;d&quot;,d3.line().x(d=&gt;x(d.date)).y(d=&gt;y(d.ma)).curve(d3.curveCatmullRom));
  const fmtVol=v=&gt;v&gt;=1e6?`${(v/1e6).toFixed(2)}M`:v&gt;=1e3?`${(v/1e3).toFixed(0)}K`:`${v.toFixed(0)}`;
  g.append(&quot;g&quot;).attr(&quot;transform&quot;,`translate(0,${h})`).call(
    d3.axisBottom(x).tickValues(x.ticks(d3.timeMonth.every(3))).tickSize(4).tickFormat(d=&gt;{const ms=[&quot;jan&quot;,&quot;fev&quot;,&quot;mar&quot;,&quot;abr&quot;,&quot;mai&quot;,&quot;jun&quot;,&quot;jul&quot;,&quot;ago&quot;,&quot;set&quot;,&quot;out&quot;,&quot;nov&quot;,&quot;dez&quot;];return ms[d.getMonth()]+&quot;/&quot;+(d.getFullYear()%100).toString().padStart(2,&quot;0&quot;);})
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.1));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().muted).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;dy&quot;,&quot;1.2em&quot;);
  });
  g.append(&quot;g&quot;).call(
    d3.axisLeft(y).ticks(4).tickFormat(fmtVol).tickSize(4)
  ).call(ax=&gt;{
    ax.select(&quot;.domain&quot;).attr(&quot;stroke&quot;,gridRGBA(0.08));
    ax.selectAll(&quot;.tick line&quot;).attr(&quot;stroke&quot;,gridRGBA(0.05));
    ax.selectAll(&quot;.tick text&quot;).attr(&quot;fill&quot;,T().teal).attr(&quot;font-size&quot;,&quot;10px&quot;)
      .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;);
  });
  g.append(&quot;text&quot;).attr(&quot;transform&quot;,&quot;rotate(-90)&quot;).attr(&quot;x&quot;,-h/2).attr(&quot;y&quot;,-68)
    .attr(&quot;text-anchor&quot;,&quot;middle&quot;).attr(&quot;fill&quot;,T().teal).attr(&quot;font-size&quot;,&quot;10px&quot;)
    .attr(&quot;font-family&quot;,&quot;Carlito,sans-serif&quot;).attr(&quot;letter-spacing&quot;,&quot;0.1em&quot;).text(&quot;VOLUME FINANCEIRO (USD)&quot;);
  const bisect=d3.bisector(d=&gt;d.date).left;
  const ttLine=g.append(&quot;line&quot;).attr(&quot;y1&quot;,0).attr(&quot;y2&quot;,h)
    .attr(&quot;stroke&quot;,gridRGBA(0.15)).attr(&quot;stroke-width&quot;,1).style(&quot;display&quot;,&quot;none&quot;);
  svg.append(&quot;rect&quot;).attr(&quot;x&quot;,mg.left).attr(&quot;y&quot;,mg.top).attr(&quot;width&quot;,w).attr(&quot;height&quot;,h)
    .attr(&quot;fill&quot;,&quot;none&quot;).attr(&quot;pointer-events&quot;,&quot;all&quot;)
    .on(&quot;mousemove&quot;,function(event){
      const [mx]=d3.pointer(event,g.node());
      const date0=x.invert(mx);
      const idx=bisect(parsed,date0,1);
      const d0=parsed[idx-1],d1=parsed[idx];
      if(!d0)return;
      const d=(!d1||(date0-d0.date&lt;d1.date-date0))?d0:d1;
      ttLine.style(&quot;display&quot;,null).attr(&quot;x1&quot;,x(d.date)).attr(&quot;x2&quot;,x(d.date));
      const tt=document.getElementById(&quot;tooltip&quot;);
      if(!tt)return;
      tt.innerHTML=`&lt;div class=&quot;tt-month&quot;&gt;${d3.timeFormat(&quot;%d %b %Y&quot;)(d.date).toUpperCase()}&lt;/div&gt;&lt;div class=&quot;tt-row&quot;&gt;&lt;span class=&quot;l&quot;&gt;Volume&lt;/span&gt;&lt;span class=&quot;v&quot; style=&quot;color:var(--teal)&quot;&gt;USD ${fmtVol(d.vol)}&lt;/span&gt;&lt;/div&gt;`;
      tt.classList.add(&quot;on&quot;);
      tt.style.left=(event.clientX+14)+&quot;px&quot;;
      tt.style.top=(event.clientY-20)+&quot;px&quot;;
    })
    .on(&quot;mouseleave&quot;,()=&gt;{ttLine.style(&quot;display&quot;,&quot;none&quot;);const tt=document.getElementById(&quot;tooltip&quot;);if(tt)tt.classList.remove(&quot;on&quot;);});
}
function renderAll(){
  BG = T().bg;
  [&quot;chart-main&quot;,&quot;chart-shares&quot;,&quot;chart-ratio&quot;,&quot;chart-volume&quot;].forEach(id =&gt; d3.select(&quot;#&quot;+id).selectAll(&quot;*&quot;).remove());
  drawMain(); drawShares(); drawRatio(); drawVolume();
}
renderAll();
window.addEventListener(&quot;resize&quot;, renderAll);
function setDashboardTheme(mode){
  window.__theme = mode;
  document.documentElement.setAttribute(&quot;data-theme&quot;, mode);
  const btn = document.getElementById(&quot;theme-toggle-btn&quot;);
  if(btn) btn.textContent = mode === &quot;dark&quot; ? &quot;☀ Claro&quot; : &quot;☽ Escuro&quot;;
  renderAll();
}
window.setDashboardTheme = setDashboardTheme;
window.__theme = window.__theme || &quot;light&quot;;
document.documentElement.setAttribute(&quot;data-theme&quot;, window.__theme);
&lt;/script&gt;

<script>
function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.chart-frame').forEach((f, i) => {
    f.style.display = i === idx ? 'block' : 'none';
    if (i === idx) {
      try { f.contentWindow.renderAll(); } catch (e) {}
    }
  });
}
let __globalTheme = 'light';
function toggleAllThemes() {
  __globalTheme = __globalTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', __globalTheme);
  const btn = document.getElementById('master-toggle-btn');
  if (btn) btn.textContent = __globalTheme === 'dark' ? '☀ Modo Claro' : '☽ Modo Escuro';
  document.querySelectorAll('.chart-frame').forEach(f => {
    try { f.contentWindow.setDashboardTheme(__globalTheme); } catch (e) {}
  });
}
</script>
