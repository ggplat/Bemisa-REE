name: Atualizar dashboard

# Roda automaticamente todo dia util (apos o fechamento de ASX e TSX) e tambem
# pode ser disparado manualmente em Actions -> "Atualizar dashboard" -> Run workflow.
on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC, seg-sex (apos fechamento ASX e TSX)
  workflow_dispatch:          # botao de execucao manual sob demanda

# Necessario para commitar o HTML e publicar no GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Testes (logica offline)
        run: python -m unittest discover -s tests -v

      - name: Gerar dashboard (dados reais)
        run: python ree_monitor.py --dashboard -v

      - name: Commitar HTML atualizado (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/index.html; then
            echo "Sem mudancas no dashboard."
            exit 0
          fi
          git add docs/index.html
          git commit -m "chore: atualizar dashboard ($(date -u +%Y-%m-%d' '%H:%M' UTC'))"
          # Retry com backoff: o workflow do REE v6 (22:30 UTC) pode ter
          # acabado de commitar na mesma branch.
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push falhou, nova tentativa em ${delay}s..."
          done
          echo "não foi possivel publicar o commit" >&2
          exit 1

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
