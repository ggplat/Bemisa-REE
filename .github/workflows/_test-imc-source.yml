name: "[TEMP] Testar fonte de noticias da IMC"

# Workflow descartavel: so verifica se sources.canada.CanadaSource().fetch()
# encontra comunicados reais da IMC via ir.imcrareearths.com, usando o codigo
# do PR #1 (branch claude/ree-comunicados-dashboard-publish-s4644d). Nao commita
# nada, nao publica no GitHub Pages. Deve ser removido apos o teste.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo do PR #1 (com a IMC)
        uses: actions/checkout@v4
        with:
          ref: claude/ree-comunicados-dashboard-publish-s4644d

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Inspecionar a estrutura da pagina real de noticias da IMC (sem publicar nada)
        run: |
          python3 << 'PYEOF'
          from sources import http_util
          from bs4 import BeautifulSoup

          url = "https://ir.imcrareearths.com/news-events/news-releases"
          resp = http_util.get(url, retries=2)
          print(f"{url} -> {'HTTP 200' if resp else 'falhou/nao-200'}")
          if not resp:
              raise SystemExit(0)

          soup = BeautifulSoup(resp.text, "html.parser")
          links = [a for a in soup.find_all("a", href=True) if "news-release-details" in a["href"]]
          print(f"Encontrados {len(links)} links de news-release-details")
          print()
          for a in links[:5]:
              # imprime um pedaco do HTML ao redor de cada link (containers pai),
              # pra localizar onde a data fica
              container = a
              for _ in range(3):
                  if container.parent:
                      container = container.parent
              html_snippet = str(container)[:1200]
              print("--- item ---")
              print(html_snippet)
              print()
          PYEOF
