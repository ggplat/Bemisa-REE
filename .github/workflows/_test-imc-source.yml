name: "[TEMP] Testar fonte de noticias da IMC"

# Workflow descartavel: so verifica se sources.canada.CanadaSource().fetch()
# encontra comunicados reais da IMC via ir.imcrareearths.com, usando o codigo
# do PR #1 (branch claude/ree-comunicados-dashboard-publish-s4644d). Nao commita
# nada, nao publica no GitHub Pages. Deve ser removido apos o teste.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo do PR #1 (com a IMC)
        uses: actions/checkout@v4
        with:
          ref: claude/ree-comunicados-dashboard-publish-s4644d

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descobrir a URL certa da pagina de noticias da IMC (sem publicar nada)
        run: |
          python3 << 'PYEOF'
          from sources import http_util
          from bs4 import BeautifulSoup

          candidates = [
              "https://ir.imcrareearths.com/",
              "https://ir.imcrareearths.com/news-releases",
              "https://ir.imcrareearths.com/news",
              "https://ir.imcrareearths.com/press-releases",
              "https://ir.imcrareearths.com/news-events/press-releases",
              "https://ir.imcrareearths.com/news-events",
              "https://imcrareearths.com/",
              "https://imcrareearths.com/news/",
              "https://imcrareearths.com/press/",
              "https://imcrareearths.com/media/",
          ]
          for url in candidates:
              resp = http_util.get(url, retries=1)
              print(f"{url} -> {'HTTP 200' if resp else 'falhou/nao-200'}")

          print()
          print("=== Links de navegacao da home ir.imcrareearths.com (se 200) ===")
          resp = http_util.get("https://ir.imcrareearths.com/", retries=1)
          if resp:
              soup = BeautifulSoup(resp.text, "html.parser")
              seen = set()
              for a in soup.find_all("a", href=True):
                  href = a["href"].strip()
                  text = a.get_text(" ", strip=True).lower()
                  if href in seen:
                      continue
                  if any(k in href.lower() or k in text for k in ("news", "press", "media", "release")):
                      seen.add(href)
                      print(f"  {href}  ({a.get_text(' ', strip=True)!r})")

          print()
          print("=== Links de navegacao da home imcrareearths.com (se 200) ===")
          resp2 = http_util.get("https://imcrareearths.com/", retries=1)
          if resp2:
              soup2 = BeautifulSoup(resp2.text, "html.parser")
              seen2 = set()
              for a in soup2.find_all("a", href=True):
                  href = a["href"].strip()
                  text = a.get_text(" ", strip=True).lower()
                  if href in seen2:
                      continue
                  if any(k in href.lower() or k in text for k in ("news", "press", "media", "release")):
                      seen2.add(href)
                      print(f"  {href}  ({a.get_text(' ', strip=True)!r})")
          PYEOF
