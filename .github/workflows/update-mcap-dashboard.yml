name: Atualizar Dashboard MCap REE

# APOSENTADO em 2026-08-12. Este dashboard (tema escuro, DM Sans) cobre as
# mesmas 5 empresas do Dashboard_REE_v6_Q2.html, que agora é atualizado pelo
# workflow "Atualizar Dashboard REE v6". Manter os dois rodando criaria duas
# fontes de verdade divergentes sobre os mesmos ativos.
#
# O agendamento foi desligado; a execução manual continua disponível para quem
# precisar regenerar a versão antiga. `mcap_dashboard.py` fica no repositório
# como referência histórica dos dados hardcoded.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-mcap-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar dashboard
        run: python mcap_dashboard.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/mcap_dashboard.html
          git diff --staged --quiet || git commit -m "dashboard: atualiza mcap $(date -u +%Y-%m-%d)"
          git push
